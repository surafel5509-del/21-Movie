name: API contract check

# Verifies the assumptions the app is built on against the *live* TorrentClaw API:
#   1. the configured key is accepted (X-RateLimit-Tier header)
#   2. authenticated search responses contain info hashes + magnet links
#   3. a magnet resolves to the expected btih
#
# This exists because the whole download feature depends on the keyed tier: on the
# anonymous tier TorrentClaw omits infoHash/magnetUrl, so no download can start.
# When that premise breaks, this job says so instead of users reporting "0 %".

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/com/torrentclaw/movies/network/**'
      - '.github/workflows/api-check.yml'
      - 'app/src/main/java/com/torrentclaw/movies/data/download/**'

jobs:
  verify:
    name: Live API verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Same resolution order as app/build.gradle.kts: secret, then the key baked
      # into this build. Never echoed in full.
      - name: Resolve API key
        id: key
        env:
          SECRET_KEY: ${{ secrets.TORRENTCLAW_API_KEY }}
        run: |
          set -euo pipefail
          KEY="${SECRET_KEY:-}"
          if [ -z "$KEY" ]; then
            KEY=$(grep -oE 'tc_[a-z0-9_]*[0-9a-f]{16,}' app/build.gradle.kts | head -n1 || true)
          fi
          if [ -z "$KEY" ]; then
            echo "No API key configured; only the anonymous tier can be checked."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          {
            echo "key=$KEY"
          } >> "$GITHUB_OUTPUT"
          echo "Key length: ${#KEY}, prefix: ${KEY:0:6}…"

      - name: Check the keyed tier unlocks magnets
        if: steps.key.outputs.present == 'true'
        env:
          TC_KEY: ${{ steps.key.outputs.key }}
        run: |
          # The API rejects clients that look like scripts (curl's default agent is
          # 403), so every probe sends a real app User-Agent.
          UA='TorrentClawMovies/1.2.0 (Android)'
          URL='https://torrentclaw.com/api/v1/search?q=inception&type=movie&limit=3&quality=1080p'

          # 1) anonymous baseline
          ANON=$(mktemp)
          curl -sS -o $ANON -A "$UA" -H 'Accept: application/json' "$URL"
          ANON_TIER=$(grep -o 'unknown' $ANON | head -1)
          ANON_HASH=$(grep -o infoHash $ANON 2>/dev/null | wc -l)

          # 2) authenticated
          KEYED=$(mktemp)
          KEYED_H=$(mktemp)
          CODE=$(curl -sS -o $KEYED -D $KEYED_H -w '%{http_code}' -A "$UA" \
            -H 'Accept: application/json' \
            -H 'Authorization: Bearer '$TC_KEY \
            -H 'X-API-Key: '$TC_KEY \
            -H 'X-Search-Source: android' "$URL")
          TIER=$(grep -i '^x-ratelimit-tier:' $KEYED_H 2>/dev/null | tr -d '\r' | awk '{print $2}')
          REMAIN=$(grep -i '^x-ratelimit-remaining:' $KEYED_H 2>/dev/null | tr -d '\r' | awk '{print $2}')
          KEYED_HASH=$(grep -o infoHash $KEYED 2>/dev/null | wc -l)
          KEYED_MAGNET=$(grep -o magnetUrl $KEYED 2>/dev/null | wc -l)
          NOTICE=$(grep -o 'require a free API key' $KEYED 2>/dev/null | head -1)

          # 3) the .torrent endpoint the app also uses
          TOR_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" \
            -H 'Authorization: Bearer '$TC_KEY \
            'https://torrentclaw.com/api/v1/torrent/0000000000000000000000000000000000000000')

          echo http:$CODE tier:${TIER:-none} remain:${REMAIN:-none} keyedHash:$KEYED_HASH anonHash:$ANON_HASH torrentEndpoint:$TOR_CODE

          {
            echo '# Live TorrentClaw API verification'
            echo
            echo 'Run on GitHub Actions against the live API, using the same User-Agent'
            echo 'and headers the app sends.'
            echo
            echo '| Probe | Result |'
            echo '| --- | --- |'
            echo '| Anonymous search - infoHash fields | '$ANON_HASH' |'
            echo '| Keyed search - HTTP | '$CODE' |'
            echo '| Keyed search - X-RateLimit-Tier | '${TIER:-none}' |'
            echo '| Keyed search - remaining | '${REMAIN:-none}' |'
            echo '| Keyed search - infoHash fields | '$KEYED_HASH' |'
            echo '| Keyed search - magnetUrl fields | '$KEYED_MAGNET' |'
            echo '| Keyed .torrent endpoint - HTTP | '$TOR_CODE' |'
            echo
            if [ $KEYED_HASH -gt 0 ]; then
              echo '**PASS**: the key unlocks info hashes and magnets, so in-app'
              echo 'BitTorrent downloads can start.'
            else
              echo '**FAIL**: the key is accepted as a request but the response still'
              echo 'withholds info hashes, so downloads would stay locked.'
              echo
              echo 'API `_notice` present: '${NOTICE:-no}
            fi
          } > api-report.md

          if [ $KEYED_HASH -gt 0 ]; then exit 0; fi
          exit 1
      - name: Check the keyless tier still degrades cleanly
        run: |
          set -uo pipefail
          # Anonymous must keep working (30 req/min) for browsing without a key.
          BODY=$(mktemp)
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' \
            -H "Accept: application/json" \
            "https://torrentclaw.com/api/v1/search?q=dune&type=movie&limit=1")
          echo "Anonymous HTTP $CODE"
          grep -o '"_notice":"[^"]*"' "$BODY" 2>/dev/null | head -1 || echo "no notice"
          if ! grep -q '"results"' "$BODY" 2>/dev/null; then
            echo "::error::Anonymous search returned no results array"
            exit 1
          fi
          echo "::notice::Anonymous tier still serves metadata."

      - name: Publish the report
        if: always()
        run: |
          if [ ! -f api-report.md ]; then
            printf '# Live API verification\n\nThe keyed check did not run.\n' > api-report.md
          fi
          git config user.name "torrentclaw-bot"
          git config user.email "bot@users.noreply.github.com"
          git add api-report.md
          git diff --cached --quiet || git commit -m "ci: live API verification report [skip ci]"
          git push || echo "could not push the report"
