name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build a release (unsigned/debug-signed) APK'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  TORRENTCLAW_API_KEY: ${{ secrets.TORRENTCLAW_API_KEY }}

jobs:
  # ───────────────────────────────────────────────────────────────
  # 1. Fast feedback: unit tests + lint, no packaging.
  # ───────────────────────────────────────────────────────────────
  test:
    name: Unit tests & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # 2. Debug APK — the artifact you can sideload immediately.
  # ───────────────────────────────────────────────────────────────
  build-debug:
    name: Build debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/TorrentClawMovies-${{ github.sha }}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TorrentClawMovies-debug-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # 3. Release APK/AAB — on a version tag or manual dispatch.
  #    Signed with your keystore when the secrets exist, otherwise
  #    built with the debug key so the artifact is still installable.
  # ───────────────────────────────────────────────────────────────
  build-release:
    name: Build release APK
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        id: keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Signing with the uploaded keystore."
          else
            echo "No keystore secret; the release build will use the debug key."
          fi

      - name: Assemble release
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TorrentClawMovies-release-apk
          path: artifacts/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
