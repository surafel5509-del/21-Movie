name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build a release (unsigned/debug-signed) APK'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  TORRENTCLAW_API_KEY: ${{ secrets.TORRENTCLAW_API_KEY }}

jobs:
  # ───────────────────────────────────────────────────────────────
  # 1. Fast feedback: unit tests + lint, no packaging.
  # ───────────────────────────────────────────────────────────────
  test:
    name: Unit tests & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee gradle-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler/test failures as check annotations (readable in the UI).
            grep -nE "^e: |error:|FAILED|What went wrong|Caused by:|Unresolved reference|Compilation error" gradle-test.log \
              | head -40 | while IFS= read -r line; do echo "::error title=Unit tests::$line"; done
            exit "$status"
          fi


      # Diagnostics: publish the failing excerpt as a commit comment so the
      # failure is readable without downloading logs or artifacts.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: gradle-test.log
          TITLE: Unit tests
        run: |
          test -f "$LOG" || exit 0
          excerpt=$(grep -nE '^e: |error:|FAILED|What went wrong|Caused by:|Unresolved reference|Compilation error|> Task .*FAILED|Could not resolve' "$LOG" | head -60)
          [ -n "$excerpt" ] || excerpt=$(tail -60 "$LOG")
          jq -n --arg body "**$TITLE failed** on \`${GITHUB_SHA:0:7}\`"\$'\n\n```\n'"$excerpt"\$'\n```' '{body: $body}' > payload.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input payload.json --jq '.html_url' || echo "commit comment failed"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-test-log
          path: gradle-test.log
          retention-days: 7

      - name: Summarise test results
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning title=Unit tests::No XML results found"
            exit 0
          fi
          count() {
            grep -ho "$1=\"[0-9]*\"" "${files[@]}" | cut -d'"' -f2 | paste -sd+ | bc
          }
          echo "::notice title=Unit tests::$(count tests) tests, $(count failures) failures, $(count errors) errors, $(count skipped) skipped"
          grep -h '<testcase' "${files[@]}" | sed -E 's/.*name="([^"]*)".*/PASS \1/' | head -60

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      # Lint is advisory here: it never blocks the APK, but the report is kept.
      - name: Android Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace --console=plain

      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # 2. Debug APK — the artifact you can sideload immediately.
  # ───────────────────────────────────────────────────────────────
  build-debug:
    name: Build debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-assemble.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE "^e: |error:|FAILED|What went wrong|Caused by:|Unresolved reference" gradle-assemble.log \
              | head -40 | while IFS= read -r line; do echo "::error title=Assemble::$line"; done
            exit "$status"
          fi


      # Diagnostics: publish the failing excerpt as a commit comment so the
      # failure is readable without downloading logs or artifacts.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: gradle-assemble.log
          TITLE: Assemble debug
        run: |
          test -f "$LOG" || exit 0
          excerpt=$(grep -nE '^e: |error:|FAILED|What went wrong|Caused by:|Unresolved reference|Compilation error|> Task .*FAILED|Could not resolve' "$LOG" | head -60)
          [ -n "$excerpt" ] || excerpt=$(tail -60 "$LOG")
          jq -n --arg body "**$TITLE failed** on \`${GITHUB_SHA:0:7}\`"\$'\n\n```\n'"$excerpt"\$'\n```' '{body: $body}' > payload.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input payload.json --jq '.html_url' || echo "commit comment failed"

      - name: Upload assemble log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-assemble-log
          path: gradle-assemble.log
          retention-days: 7

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/TorrentClawMovies-${{ github.sha }}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: TorrentClawMovies-debug-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # 3. Release APK/AAB — on a version tag or manual dispatch.
  #    Signed with your keystore when the secrets exist, otherwise
  #    built with the debug key so the artifact is still installable.
  # ───────────────────────────────────────────────────────────────
  build-release:
    name: Build release APK
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # `secrets` is not allowed in an `if:` expression, so the check happens
      # inside the step and the result is exposed as a step output.
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Signing with the uploaded keystore."
          else
            echo "No keystore secret; the release build will use the debug key."
          fi

      - name: Assemble release
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME//\//-}"
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "artifacts/TorrentClawMovies-${VERSION}-release.apk"
          done
          ls -la artifacts

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: TorrentClawMovies-release-apk
          path: artifacts/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TorrentClaw Movies ${{ github.ref_name }}
          files: artifacts/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Sideload `TorrentClawMovies-${{ github.ref_name }}-release.apk`
            (Android 8.0 / API 26 or newer).

            The release build falls back to the debug signing key unless the
            `KEYSTORE_*` secrets are configured, so this APK installs over a
            previous build from the same workflow.

            **In the app**
            - Discover popular and trending movies from the TorrentClaw API
            - Search with 400 ms debounce, quality and sort filters
            - Detail view with collapsing backdrop, releases sorted by swarm health
            - Open magnet links in your torrent client, or copy them
            - Real downloads: resumable `.torrent` transfers, pause/resume/retry,
              progress persisted across restarts, saved to `Downloads/TorrentClaw`

            The app does not bundle a BitTorrent engine: it hands torrents to the
            client you already use.
